<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="{{TOKEN}}">
<title>Ouroboros unpacker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Unlock and extract</h1>
  <p class="sub">This file holds an encrypted archive. Enter the passphrase and choose where the files should go.</p>

  <section>
    <label for="pw">Passphrase</label>
    <input id="pw" type="password" autocomplete="current-password">
    <label class="inline"><input type="checkbox" id="show"> Show passphrase</label>
    <div class="error small" id="pwhint" hidden></div>
    <div id="keyblock" hidden>
      <label>Keyfile (required for this archive)</label>
      <div class="row"><input type="text" id="keyfile" readonly placeholder="None chosen"><button type="button" id="pickkey">Choose...</button></div>
    </div>
  </section>

  <section>
    <label for="dest">Extract to</label>
    <div class="row"><input type="text" id="dest" readonly><button type="button" id="pickdest">Browse...</button></div>
    <div class="hint">Pick an empty or new folder. A file can be stored under any name, including ones like .bashrc, so check the preview first and avoid your home folder.</div>
    <div class="cols">
      <div><label for="conflict">If a file already exists</label>
        <select id="conflict">
          <option value="rename">Keep both (add a number)</option>
          <option value="skip">Skip it</option>
          <option value="overwrite">Overwrite it</option>
        </select></div>
      <div><label class="inline pad-top"><input type="checkbox" id="modes" checked> Restore dates and permissions</label></div>
    </div>
  </section>

  <section>
    <div class="row">
      <button class="primary" id="go" type="button">Extract</button>
      <button id="preview" type="button">Preview contents</button>
      <span class="grow"></span>
      <span id="quitslot"></span>
    </div>
    <div id="prog"></div>
    <div id="msg"></div>
    <div id="tree"></div>
  </section>
</main>
<script src="/static/common.js"></script>
<script src="/static/unpacker.js"></script>
</body>
</html>
