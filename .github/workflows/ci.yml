name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: ./build.sh host
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  windows-native-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Build with the PowerShell script
        shell: pwsh
        run: .\build.ps1 host
      - name: Build with the cmd wrapper
        shell: cmd
        run: build.cmd host
      - name: Show the unpacker folder if a build failed
        if: failure()
        shell: pwsh
        run: Get-ChildItem -Force internal\stubs\bin | Format-Table Name, Length
      - name: Pack and unpack with the built program
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path t\in\sub | Out-Null
          'hello' | Set-Content -NoNewline t\in\sub\a.txt
          $env:OUROBOROS_PASSPHRASE = 'ci-passphrase-123'
          .\dist\ouroboros.exe -o t\out.exe t\in
          if ($LASTEXITCODE -ne 0) { throw 'packing failed' }
          $env:OUROBOROS_PASSPHRASE = 'ci-passphrase-123'
          .\t\out.exe -dest t\ex
          if ($LASTEXITCODE -ne 0) { throw 'unpacking failed' }
          if ((Get-Content -Raw t\ex\in\sub\a.txt) -ne 'hello') { throw 'content differs' }

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: ./build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ouroboros
          path: dist/
